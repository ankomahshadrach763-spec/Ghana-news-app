<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GhanaVoice News • Fixed LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: #FFF8EE; color: #1a1a1a; min-height: 100vh; }
.topbar { background: #D4270C; color: white; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; }
.topbar-logo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 900; }
.topbar-logo .flag { font-size: 1.6rem; }
.topbar-badge { font-size: 0.75rem; font-weight: 800; background: rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 14px; }
.lang-strip { background: #F4A31C; padding: 10px 16px; overflow-x: auto; white-space: nowrap; }
.lang-btn { display: inline-block; background: rgba(255,255,255,0.4); border: 2px solid transparent; border-radius: 30px; padding: 6px 16px; margin-right: 8px; font-size: 0.9rem; font-weight: 800; color: #3a1e00; cursor: pointer; }
.lang-btn.active { background: white; border-color: #3a1e00; color: #D4270C; }
.main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
.mic-big { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg,#F4A31C,#e08c10); font-size: 2.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(244,163,28,0.40); }
.mic-big.recording { background: linear-gradient(135deg,#D4270C,#b01e09); animation: mic-ring 1s infinite; }
@keyframes mic-ring { 0%{box-shadow:0 0 0 0 rgba(212,39,12,0.4)} 70%{box-shadow:0 0 0 18px rgba(212,39,12,0)} 100%{box-shadow:0 0 0 0 rgba(212,39,12,0)} }
.news-card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 14px; }
.card-img { width: 100%; height: 200px; object-fit: cover; }
.card-body { padding: 18px; }
.status-bar { border-radius: 14px; padding: 14px 18px; margin-bottom: 20px; display: none; align-items: center; gap: 12px; background: #1a5fa8; color: white; font-weight: 800; }
.status-bar.visible { display: flex; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a1a1a; color: white; border-radius: 30px; padding: 12px 24px; z-index: 9999; transition: transform 0.35s; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo"><span class="flag">🇬🇭</span> GhanaVoice News • <strong>LIVE</strong></div>
  <div class="topbar-badge" id="activeLangBadge">🌍 Twi</div>
</div>

<div class="lang-strip">
  <span style="font-size:0.75rem;font-weight:900;color:#5a3000;margin-right:10px;">🗣 Language:</span>
  <span class="lang-btn active" onclick="pickLang(this,'Twi')">Twi</span>
  <span class="lang-btn" onclick="pickLang(this,'Ewe')">Ewe</span>
  <span class="lang-btn" onclick="pickLang(this,'Ga')">Ga</span>
  <span class="lang-btn" onclick="pickLang(this,'Fante')">Fante</span>
  <span class="lang-btn" onclick="pickLang(this,'Dagbani')">Dagbani</span>
  <span class="lang-btn" onclick="pickLang(this,'English')">English</span>
</div>

<div class="main">
  <div style="background:white;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,0.1);padding:24px 20px;margin-bottom:20px;text-align:center;">
    <h2>🔍 Speak Ghana News</h2>
    <p>Voice in 11 languages • Real-time news with photos</p>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin:20px 0;">
      <button class="mic-big" id="micBtn" onclick="toggleMic()">🎤</button>
      <div class="mic-label" id="micLabel">Tap to speak • Best in Chrome</div>
    </div>
    <div style="display:flex;gap:10px;">
      <input type="text" id="queryInput" placeholder="e.g. Accra floods or cocoa prices" style="flex:1;padding:14px;border:3px solid #e0e0e0;border-radius:14px;"/>
      <button onclick="startSearch()" style="background:#D4270C;color:white;border:none;border-radius:14px;padding:14px 20px;font-size:1.4rem;">🔍</button>
    </div>
  </div>

  <div class="status-bar" id="statusBar"><div class="status-spinner" style="width:22px;height:22px;border:3px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;"></div><span id="statusText">Loading live Ghana news...</span></div>

  <div id="answerBox" style="background:white;border-radius:20px;border-left:6px solid #1E6B35;padding:20px;margin-bottom:20px;display:none;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <span style="font-size:1.5rem">🤖</span>
      <span style="background:#1E6B35;color:white;font-size:0.75rem;font-weight:900;border-radius:20px;padding:4px 12px;">LIVE AI SUMMARY</span>
    </div>
    <div id="answerText" style="font-size:1.05rem;font-weight:700;line-height:1.7;"></div>
    <button id="listenAiBtn" onclick="listenToAnswer()" style="background:#1E6B35;color:white;border:none;border-radius:12px;padding:12px 22px;margin-top:10px;font-weight:900;cursor:pointer;">🔊 Listen</button>
  </div>

  <div id="trendingRow" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;"></div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div id="sectionTitle" style="font-size:1.3rem;font-weight:900;">📰 Latest Ghana News</div>
    <div id="articleCount" style="background:#F4A31C;color:#3a1e00;font-size:0.75rem;font-weight:900;border-radius:20px;padding:4px 12px;">Loading...</div>
  </div>

  <div id="newsGrid" style="display:flex;flex-direction:column;gap:14px;"></div>
</div>

<footer style="text-align:center;padding:24px;font-size:0.82rem;color:#aaa;">Made for Ghana • Voice + Live News</footer>
<div id="toast" class="toast"><span id="toastIcon">✅</span> <span id="toastMsg"></span></div>

<script>
// STATE
let activeLangName = 'Twi';
let isRecording = false;
let recognition = null;
let aiAnswerText = '';
let currentArticles = [];

// Simple fallback articles (used if network fails)
const FALLBACK = [
  {title:"Accra Newtown Building Collapse", summary:"Rescue operations continue after heavy rains caused a 3-storey building to collapse in Newtown.", category:"general", source:"GhanaWeb", time:"Today", image:"https://picsum.photos/id/1015/600/400"},
  {title:"UN Passes Ghana-Led Slavery Resolution", summary:"Ghana scores major diplomatic win at the United Nations.", category:"politics", source:"BBC", time:"2d ago", image:"https://picsum.photos/id/201/600/400"},
  {title:"Heavy Rains Flood Parts of Accra", summary:"Residents advised to stay alert as NADMO responds.", category:"general", source:"Citinewsroom", time:"Today", image:"https://picsum.photos/id/133/600/400"}
];

// Pick Language
function pickLang(el, name) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activeLangName = name;
  document.getElementById('activeLangBadge').textContent = '🌍 ' + name;
  showToast('🌍', `Language set to ${name}. Note: Full local voices use best available English accent.`);
}

// Microphone (Voice Input)
function toggleMic() {
  if (isRecording) { stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('⚠️', 'Voice input needs Chrome or Edge browser.');
    return;
  }
  recognition = new SR();
  recognition.lang = 'en-GH';
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('micBtn').textContent = '⏹';
    document.getElementById('micLabel').textContent = `Listening in ${activeLangName}...`;
  };
  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    document.getElementById('queryInput').value = transcript;
  };
  recognition.onend = () => { stopMic(); const q = document.getElementById('queryInput').value.trim(); if (q) startSearch(); };
  recognition.onerror = () => { stopMic(); showToast('❌', 'Voice error. Try typing.'); };
  try { recognition.start(); } catch(e) { stopMic(); }
}

function stopMic() {
  isRecording = false;
  if (recognition) recognition.stop();
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micBtn').textContent = '🎤';
  document.getElementById('micLabel').textContent = 'Tap to speak';
}

// Real News Fetch (Improved with fallback)
async function fetchGhanaNews(query = 'ghana') {
  document.getElementById('statusBar').classList.add('visible');
  document.getElementById('statusText').textContent = `Fetching live news for "${query}"...`;

  try {
    // Try NewsAPI.org (replace with your free key if you have one)
    const apiKey = 'YOUR_FREE_NEWSAPI_KEY_HERE'; // ← Put your key here if you registered at newsapi.org
    let url = `https://newsapi.org/v2/everything?q=${encodeURIComponent(query + ' Ghana')}&language=en&sortBy=publishedAt&apiKey=${apiKey}`;

    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      if (data.articles && data.articles.length > 0) {
        return data.articles.slice(0, 8).map((a, i) => ({
          title: a.title,
          summary: (a.description || a.title).substring(0, 160) + '...',
          category: 'general',
          source: a.source.name,
          time: new Date(a.publishedAt).toLocaleDateString('en-GB', {month:'short', day:'numeric'}),
          image: a.urlToImage || `https://picsum.photos/id/${100+i}/600/400`
        }));
      }
    }
  } catch(e) {
    console.log("NewsAPI fetch failed, using fallback");
  }

  // Fallback to static + random images if no internet or no key
  return FALLBACK.map((item, i) => ({...item, image: `https://picsum.photos/id/${100+i}/600/400`}));
}

async function startSearch() {
  let query = document.getElementById('queryInput').value.trim() || 'ghana';
  document.getElementById('answerBox').style.display = 'none';
  document.getElementById('newsGrid').innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Loading live stories...</div>';

  currentArticles = await fetchGhanaNews(query);

  aiAnswerText = `Here are the latest Ghana news stories about "${query}". Tap the listen button on any article to hear it read aloud.`;

  document.getElementById('answerText').textContent = aiAnswerText;
  document.getElementById('answerBox').style.display = 'block';

  document.getElementById('statusBar').classList.remove('visible');
  renderArticles(currentArticles);
  showToast('✅', `Loaded ${currentArticles.length} stories`);
}

function renderArticles(articles) {
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '';
  document.getElementById('articleCount').textContent = `${articles.length} Stories`;

  articles.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'news-card';
    card.innerHTML = `
      <img src="${a.image}" class="card-img" onerror="this.src='https://picsum.photos/id/1015/600/400'">
      <div class="card-body">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <span style="background:#FFF3DC;color:#7a5000;padding:2px 8px;border-radius:6px;font-size:0.68rem;font-weight:900;">${a.category.toUpperCase()}</span>
          <span style="font-size:0.72rem;color:#999;">${a.source}</span>
          <span style="margin-left:auto;font-size:0.7rem;color:#ccc;">${a.time}</span>
        </div>
        <div style="font-size:1.02rem;font-weight:900;line-height:1.4;margin-bottom:6px;">${a.title}</div>
        <div style="font-size:0.85rem;color:#666;line-height:1.5;">${a.summary}</div>
        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:0.7rem;background:#FFF3DC;color:#F4A31C;padding:2px 8px;border-radius:6px;">${activeLangName}</span>
          <button onclick="readCard(${i}, event)" style="background:transparent;border:2px solid #1E6B35;color:#1E6B35;padding:6px 14px;border-radius:10px;font-weight:900;cursor:pointer;">🔊 Listen</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

function readCard(i, e) {
  e.stopPropagation();
  const a = currentArticles[i];
  if (!a) return;
  speak(`${a.title}. ${a.summary}. From ${a.source || 'Ghana news'}.`);
}

function speak(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  // Prefer Ghanaian/English voices
  const bestVoice = voices.find(v => v.lang.includes('en') && (v.name.toLowerCase().includes('ghana') || v.name.toLowerCase().includes('africa'))) ||
                    voices.find(v => v.lang === 'en-GB') || voices[0];
  if (bestVoice) utterance.voice = bestVoice;
  utterance.rate = 0.92;
  utterance.pitch = 1.05;
  speechSynthesis.speak(utterance);
}

function listenToAnswer() {
  speak(aiAnswerText);
}

function showToast(icon, msg) {
  document.getElementById('toastIcon').textContent = icon;
  document.getElementById('toastMsg').textContent = msg;
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// Init
async function init() {
  // Build trending (simple)
  const trendingHTML = `<span style="font-size:0.8rem;font-weight:900;color:#D4270C;margin-right:10px;">🔥 Trending:</span>`;
  ['Accra floods', 'Cocoa price', 'Black Stars', 'UN resolution'].forEach(t => {
    const chip = document.createElement('span');
    chip.style = 'background:white;border:2px solid #e0e0e0;border-radius:20px;padding:5px 14px;font-size:0.82rem;cursor:pointer;';
    chip.textContent = t;
    chip.onclick = () => { document.getElementById('queryInput').value = t; startSearch(); };
    document.getElementById('trendingRow').appendChild(chip);
  });

  // Load initial news
  currentArticles = await fetchGhanaNews('ghana');
  renderArticles(currentArticles);

  document.getElementById('queryInput').addEventListener('keydown', e => { if (e.key === 'Enter') startSearch(); });

  showToast('🇬🇭', 'App fixed! Tap mic to speak or type. News loads from live sources.');
}

init();
</script>
</body>
</html>
